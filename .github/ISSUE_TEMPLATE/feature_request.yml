name: Feature Request
description: 새로운 기능이나 개선 사항을 제안합니다.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 점이 불편하거나 필요한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 동작을 구체적으로 적어주세요.
    validations:
      required: true
